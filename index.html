<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - Leitor Físico</title>
    <!-- Tailwind CSS para um design limpo e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animação suave para quando uma leitura é gravada com sucesso */
        @keyframes piscarVerde {
            0% { background-color: #dcfce7; } /* Verde clarinho */
            100% { background-color: #ffffff; }
        }
        .leitura-sucesso {
            animation: piscarVerde 0.8s ease-out;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans text-gray-800 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-2xl bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-200">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-900 mb-2">Inventário Rápido</h1>
            <p class="text-gray-500">Utilize o seu leitor de código de barras (USB/Bluetooth) para registar os produtos.</p>
        </div>

        <!-- Passo 1: Abrir o ficheiro -->
        <div class="bg-blue-50 p-6 rounded-lg border border-blue-100 mb-8 text-center transition-all duration-300" id="passo-1">
            <button id="btn-iniciar-arquivo" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition-colors w-full md:w-auto text-lg flex items-center justify-center mx-auto gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                Passo 1: Criar / Abrir Ficheiro (.txt)
            </button>
            <p class="text-sm text-gray-600 mt-4 font-medium" id="status-arquivo">A aguardar seleção do ficheiro de destino...</p>
        </div>

        <!-- Passo 2: Área de Leitura (Inicialmente desativada e semi-transparente) -->
        <div id="area-leitura" class="opacity-50 pointer-events-none transition-opacity duration-300">
            <label for="input-bip" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">
                Passo 2: Dispare o Leitor Aqui
            </label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <span class="text-2xl">📡</span>
                </div>
                <input type="text" id="input-bip" placeholder="Aguardando bip do leitor..." 
                       class="w-full pl-12 pr-4 py-4 text-2xl font-mono text-center border-4 border-gray-300 rounded-lg bg-gray-50 focus:bg-white focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-200 transition-all placeholder-gray-400" disabled>
            </div>
            <p class="text-xs text-center text-gray-500 mt-2">Mantenha esta caixa selecionada para o leitor funcionar.</p>
        </div>

        <!-- Resultados -->
        <div class="mt-8">
            <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3 flex items-center justify-between">
                <span>Últimos Registos</span>
                <span id="contador" class="bg-gray-200 text-gray-700 py-1 px-3 rounded-full text-xs">0 itens</span>
            </h2>
            <!-- A caixa de logs agora tem o efeito visual quando lê com sucesso -->
            <div id="logs-container" class="bg-gray-50 rounded-lg border border-gray-200 h-48 overflow-hidden relative">
                <div id="logs" class="p-4 h-full overflow-y-auto text-base font-mono whitespace-pre-wrap text-gray-700"></div>
                <!-- Mensagem inicial se estiver vazio -->
                <div id="log-vazio" class="absolute inset-0 flex items-center justify-center text-gray-400 italic">
                    Nenhum código lido ainda.
                </div>
            </div>
        </div>

    </div>

    <script>
        let fileHandle;
        let contagemItens = 0;
        const inputBip = document.getElementById('input-bip');
        const logsContainer = document.getElementById('logs-container');
        const logsDiv = document.getElementById('logs');
        const logVazio = document.getElementById('log-vazio');
        const contadorSpan = document.getElementById('contador');
        const areaLeitura = document.getElementById('area-leitura');

        // Função para emitir um "Bip" de sucesso no computador
        function tocarBipSucesso() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, ctx.currentTime); // Frequência mais alta, som mais limpo
                
                gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {
                console.log("Áudio não suportado ou bloqueado.", e);
            }
        }

        // 1. Ligar ao ficheiro de texto
        document.getElementById('btn-iniciar-arquivo').addEventListener('click', async () => {
            try {
                // Abre a janela para o utilizador escolher onde guardar o ficheiro
                fileHandle = await window.showSaveFilePicker({
                    suggestedName: 'inventario-loja.txt',
                    types: [{ description: 'Documento de Texto', accept: {'text/plain': ['.txt']} }]
                });
                
                // Atualiza o estado visual indicando sucesso
                const statusP = document.getElementById('status-arquivo');
                statusP.innerHTML = `<span class="text
